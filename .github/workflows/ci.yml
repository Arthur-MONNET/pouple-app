name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push replaces the run still going on the same branch, except on main, where every commit keeps its own run:
# each main commit gets a group of its own, since a shared group would still drop a run that waits behind another.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Check formatting
        working-directory: core
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: Time the process and port scans the dev server uses
        run: |
          time /usr/sbin/lsof -nP -a -p $$ -iTCP -sTCP:LISTEN > /dev/null || true
          time /bin/ps -axo pid=,ppid= > /dev/null
      - name: Vet and test
        working-directory: core
        run: |
          go vet ./...
          go test -race -timeout 5m ./...
      - name: Check Go vulnerabilities
        working-directory: core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm knip
          pnpm build

  app:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test the Swift app
        run: swift test --package-path app
      - name: Test repository scripts
        run: |
          bash scripts/test-install-record.sh
          bash scripts/test-next-version.sh
          bash scripts/test-check-changed.sh
