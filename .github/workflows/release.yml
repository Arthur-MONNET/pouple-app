name: Release

# Publish a source release by pushing a version tag such as v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate the release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a release tag in the form vMAJOR.MINOR.PATCH.'
            exit 1
          fi

      - name: Publish the source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Pouple ${GITHUB_REF_NAME#v}" \
            --notes 'Build and install Pouple on your Mac with the [installation instructions](https://arthur-monnet.github.io/pouple-app/#install).'
